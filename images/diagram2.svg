<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <defs>
    <style>
      .box { fill: none; stroke: #30363d; stroke-width: 1.2; rx: 4px; }
      .box-hi { fill: none; stroke: #8b949e; stroke-width: 1.5; rx: 4px; }
      .title { fill: #f0f6fc; font-family: monospace; font-size: 13px; font-weight: 600; }
      .sub { fill: #8b949e; font-family: monospace; font-size: 11px; }
      .code { fill: #79c0ff; font-family: monospace; font-size: 11px; }
      .line { stroke: #484f58; stroke-width: 1.2; fill: none; }
      .arr { fill: #484f58; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arr"/>
    </marker>
  </defs>

  <rect x="20" y="30" width="120" height="60" class="box-hi" />
  <text x="80" y="55" text-anchor="middle" class="title">1. CPUID</text>
  <text x="80" y="73" text-anchor="middle" class="code">Bit 31 / Vendor</text>

  <line x1="140" y1="60" x2="170" y2="60" class="line" marker-end="url(#arr)" />

  <rect x="170" y="30" width="120" height="60" class="box" />
  <text x="230" y="55" text-anchor="middle" class="title">2. Registry</text>
  <text x="230" y="73" text-anchor="middle" class="code">SystemBiosVersion</text>

  <line x1="290" y1="60" x2="320" y2="60" class="line" marker-end="url(#arr)" />

  <rect x="320" y="30" width="120" height="60" class="box" />
  <text x="380" y="55" text-anchor="middle" class="title">3. SMBIOS</text>
  <text x="380" y="73" text-anchor="middle" class="code">Type 0 / 1 Strings</text>

  <line x1="440" y1="60" x2="470" y2="60" class="line" marker-end="url(#arr)" />

  <rect x="470" y="30" width="120" height="60" class="box" />
  <text x="530" y="55" text-anchor="middle" class="title">4. Processes</text>
  <text x="530" y="73" text-anchor="middle" class="code">vmtoolsd / vbox</text>

  <line x1="590" y1="60" x2="620" y2="60" class="line" marker-end="url(#arr)" />

  <rect x="620" y="30" width="120" height="60" class="box" />
  <text x="680" y="55" text-anchor="middle" class="title">5. Drivers</text>
  <text x="680" y="73" text-anchor="middle" class="code">VBoxGuest.sys</text>

  <line x1="740" y1="60" x2="770" y2="60" class="line" marker-end="url(#arr)" />

  <rect x="770" y="30" width="110" height="60" class="box-hi" />
  <text x="825" y="55" text-anchor="middle" class="title">6. Devices</text>
  <text x="825" y="73" text-anchor="middle" class="code">RawInput &lt; 2</text>

  <!-- Catch line down to ExitProcess -->
  <path d="M 80 90 L 80 140 M 230 90 L 230 140 M 380 90 L 380 140 M 530 90 L 530 140 M 680 90 L 680 140 M 825 90 L 825 140 M 80 140 L 825 140 M 450 140 L 450 165" class="line" />

  <rect x="350" y="165" width="200" height="40" class="box" />
  <text x="450" y="188" text-anchor="middle" class="title">Terminates: ExitProcess( 0 )</text>

</svg>