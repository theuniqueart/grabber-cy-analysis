<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <style>
      .box { fill: none; stroke: #30363d; stroke-width: 1.2; rx: 4px; }
      .box-hi { fill: none; stroke: #8b949e; stroke-width: 1.5; rx: 4px; }
      .title { fill: #f0f6fc; font-family: monospace; font-size: 13px; font-weight: 600; }
      .sub { fill: #8b949e; font-family: monospace; font-size: 11px; }
      .code { fill: #79c0ff; font-family: monospace; font-size: 11px; }
      .line { stroke: #484f58; stroke-width: 1.2; fill: none; }
      .arr { fill: #484f58; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arr"/>
    </marker>
  </defs>

  <rect x="40" y="35" width="220" height="50" class="box" />
  <text x="150" y="58" text-anchor="middle" class="title">Malware Calls Wrapper</text>
  <text x="150" y="74" text-anchor="middle" class="code">lazy_BCryptDecrypt</text>

  <line x1="260" y1="60" x2="330" y2="60" class="line" marker-end="url(#arr)" />

  <rect x="330" y="35" width="220" height="50" class="box-hi" />
  <text x="440" y="58" text-anchor="middle" class="title">Pointer Cached?</text>
  <text x="440" y="74" text-anchor="middle" class="sub">pfn_BCryptDecrypt != NULL</text>

  <line x1="550" y1="60" x2="620" y2="60" class="line" marker-end="url(#arr)" />

  <rect x="620" y="35" width="240" height="50" class="box" />
  <text x="740" y="58" text-anchor="middle" class="title">Direct Fast Call</text>
  <text x="740" y="74" text-anchor="middle" class="code">JMP [pfn_BCryptDecrypt]</text>

  <!-- If No: LoadLibraryA -->
  <line x1="440" y1="85" x2="440" y2="140" class="line" marker-end="url(#arr)" />
  <text x="450" y="115" class="sub">No (First Run)</text>

  <rect x="280" y="140" width="320" height="60" class="box-hi" />
  <text x="440" y="163" text-anchor="middle" class="title">Dynamic Resolution Routine</text>
  <text x="440" y="181" text-anchor="middle" class="code">LoadLibraryA + GetProcAddress</text>

  <path d="M 600 170 L 740 170 L 740 85" class="line" marker-end="url(#arr)" />

</svg>