<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <style>
      .box { fill: none; stroke: #30363d; stroke-width: 1.2; rx: 4px; }
      .box-hi { fill: none; stroke: #8b949e; stroke-width: 1.5; rx: 4px; }
      .title { fill: #f0f6fc; font-family: monospace; font-size: 13px; font-weight: 600; }
      .sub { fill: #8b949e; font-family: monospace; font-size: 11px; }
      .code { fill: #79c0ff; font-family: monospace; font-size: 11px; }
      .line { stroke: #484f58; stroke-width: 1.2; fill: none; }
      .arr { fill: #484f58; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arr"/>
    </marker>
  </defs>

  <!-- Endpoints -->
  <rect x="80" y="20" width="220" height="45" class="box" />
  <text x="190" y="47" text-anchor="middle" class="title">Infected Host (DGT4R)</text>

  <rect x="600" y="20" width="220" height="45" class="box-hi" />
  <text x="710" y="47" text-anchor="middle" class="title">Attacker Server (doxbin.cy)</text>

  <!-- Timeline vertical lines -->
  <line x1="190" y1="65" x2="190" y2="240" class="line" />
  <line x1="710" y1="65" x2="710" y2="240" class="line" />

  <!-- Message 1 -->
  <line x1="190" y1="100" x2="710" y2="100" class="line" marker-end="url(#arr)" />
  <text x="450" y="93" text-anchor="middle" class="code">1. POST /init?action=init&amp;id={GUID}&amp;os=Win11</text>

  <!-- Message 2 -->
  <line x1="710" y1="140" x2="190" y2="140" class="line" marker-end="url(#arr)" />
  <text x="450" y="133" text-anchor="middle" class="sub">2. HTTP 200 OK (Tasking JSON: clipper, rat, stealer)</text>

  <!-- Message 3 -->
  <line x1="190" y1="180" x2="710" y2="180" class="line" marker-end="url(#arr)" />
  <text x="450" y="173" text-anchor="middle" class="code">3. POST /exfiltrate (Multipart Zip Payload: %TEMP%\_{HEX}.tmp)</text>

  <!-- Message 4 -->
  <line x1="710" y1="220" x2="190" y2="220" class="line" marker-end="url(#arr)" />
  <text x="450" y="213" text-anchor="middle" class="sub">4. HTTP 200 OK (Staging Wiped &amp; Deleted)</text>

</svg>