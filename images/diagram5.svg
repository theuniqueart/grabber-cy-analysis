<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <style>
      .box { fill: none; stroke: #30363d; stroke-width: 1.2; rx: 4px; }
      .box-hi { fill: none; stroke: #8b949e; stroke-width: 1.5; rx: 4px; }
      .title { fill: #f0f6fc; font-family: monospace; font-size: 13px; font-weight: 600; }
      .sub { fill: #8b949e; font-family: monospace; font-size: 11px; }
      .code { fill: #79c0ff; font-family: monospace; font-size: 11px; }
      .line { stroke: #484f58; stroke-width: 1.2; fill: none; }
      .arr { fill: #484f58; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arr"/>
    </marker>
  </defs>

  <rect x="50" y="25" width="220" height="50" class="box" />
  <text x="160" y="46" text-anchor="middle" class="title">ZwDelayExecution ( 500ms )</text>
  <text x="160" y="63" text-anchor="middle" class="sub">Loop polling timer</text>

  <line x1="270" y1="50" x2="330" y2="50" class="line" marker-end="url(#arr)" />

  <rect x="330" y="25" width="240" height="50" class="box-hi" />
  <text x="450" y="46" text-anchor="middle" class="title">GetClipboardData</text>
  <text x="450" y="63" text-anchor="middle" class="code">CF_UNICODETEXT / CF_TEXT</text>

  <line x1="570" y1="50" x2="630" y2="50" class="line" marker-end="url(#arr)" />

  <rect x="630" y="25" width="220" height="50" class="box" />
  <text x="740" y="46" text-anchor="middle" class="title">Regex Matcher</text>
  <text x="740" y="63" text-anchor="middle" class="sub">BTC, ETH, TRX, LTC, SOL, DOGE</text>

  <!-- Downwards to swap -->
  <line x1="740" y1="75" x2="740" y2="130" class="line" marker-end="url(#arr)" />

  <rect x="490" y="130" width="360" height="60" class="box-hi" />
  <text x="670" y="152" text-anchor="middle" class="title">Atomic Swap Routine ( +0x894F0 )</text>
  <text x="670" y="172" text-anchor="middle" class="code">EmptyClipboard() -&gt; SetClipboardData(CF_UNICODETEXT)</text>

  <!-- Back to loop -->
  <path d="M 490 160 L 160 160 L 160 75" class="line" marker-end="url(#arr)" />
  <text x="320" y="152" text-anchor="middle" class="sub">Replaces target address with attacker wallet</text>

</svg>