<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <style>
      .box { fill: none; stroke: #30363d; stroke-width: 1.2; rx: 4px; }
      .box-hi { fill: none; stroke: #8b949e; stroke-width: 1.5; rx: 4px; }
      .title { fill: #f0f6fc; font-family: monospace; font-size: 13px; font-weight: 600; }
      .sub { fill: #8b949e; font-family: monospace; font-size: 11px; }
      .code { fill: #79c0ff; font-family: monospace; font-size: 11px; }
      .line { stroke: #484f58; stroke-width: 1.2; fill: none; }
      .arr { fill: #484f58; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arr"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="160" height="50" class="box" />
  <text x="100" y="42" text-anchor="middle" class="title">Execution Start</text>
  <text x="100" y="58" text-anchor="middle" class="sub">User launches binary</text>

  <line x1="180" y1="45" x2="230" y2="45" class="line" marker-end="url(#arr)" />

  <rect x="230" y="20" width="180" height="50" class="box-hi" />
  <text x="320" y="42" text-anchor="middle" class="title">Anti-Analysis Gate</text>
  <text x="320" y="58" text-anchor="middle" class="code">check_anti_analysis ( +0x5F710 )</text>

  <line x1="410" y1="45" x2="470" y2="45" class="line" marker-end="url(#arr)" />

  <rect x="470" y="20" width="180" height="50" class="box" />
  <text x="560" y="42" text-anchor="middle" class="title">Decoy Binder</text>
  <text x="560" y="58" text-anchor="middle" class="sub">Carve BND! overlay</text>

  <line x1="650" y1="45" x2="710" y2="45" class="line" marker-end="url(#arr)" />

  <rect x="710" y="20" width="170" height="50" class="box-hi" />
  <text x="795" y="42" text-anchor="middle" class="title">Direct Syscalls</text>
  <text x="795" y="58" text-anchor="middle" class="code">Halo's Gate ( +0x687D0 )</text>

  <!-- Split line to workers -->
  <path d="M 795 70 L 795 110 M 110 110 L 795 110" class="line" />

  <!-- Workers row 1 -->
  <line x1="110" y1="110" x2="110" y2="140" class="line" marker-end="url(#arr)" />
  <rect x="30" y="140" width="160" height="55" class="box" />
  <text x="110" y="162" text-anchor="middle" class="title">Crypto Clipper</text>
  <text x="110" y="180" text-anchor="middle" class="code">500ms loop ( +0x88AB0 )</text>

  <line x1="340" y1="110" x2="340" y2="140" class="line" marker-end="url(#arr)" />
  <rect x="260" y="140" width="160" height="55" class="box" />
  <text x="340" y="162" text-anchor="middle" class="title">Exodus Backdoor</text>
  <text x="340" y="180" text-anchor="middle" class="code">app.asar ( +0xB5ED0 )</text>

  <line x1="560" y1="110" x2="560" y2="140" class="line" marker-end="url(#arr)" />
  <rect x="480" y="140" width="160" height="55" class="box" />
  <text x="560" y="162" text-anchor="middle" class="title">Discord Injector</text>
  <text x="560" y="180" text-anchor="middle" class="code">index.js ( +0xACBD0 )</text>

  <line x1="780" y1="110" x2="780" y2="140" class="line" marker-end="url(#arr)" />
  <rect x="700" y="140" width="160" height="55" class="box" />
  <text x="780" y="162" text-anchor="middle" class="title">Browser Stealer</text>
  <text x="780" y="180" text-anchor="middle" class="code">v20 / DPAPI ( +0xE19B0 )</text>

  <!-- Connect to C2 -->
  <path d="M 110 195 L 110 240 M 340 195 L 340 240 M 560 195 L 560 240 M 780 195 L 780 240 M 110 240 L 780 240 M 450 240 L 450 270" class="line" />

  <rect x="300" y="270" width="300" height="55" class="box-hi" />
  <text x="450" y="293" text-anchor="middle" class="title">Remote Collector (doxbin.cy)</text>
  <text x="450" y="311" text-anchor="middle" class="code">POST /init &amp; POST /exfiltrate</text>

</svg>