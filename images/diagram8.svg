<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <style>
      .box { fill: none; stroke: #30363d; stroke-width: 1.2; rx: 4px; }
      .box-hi { fill: none; stroke: #8b949e; stroke-width: 1.5; rx: 4px; }
      .title { fill: #f0f6fc; font-family: monospace; font-size: 13px; font-weight: 600; }
      .sub { fill: #8b949e; font-family: monospace; font-size: 11px; }
      .code { fill: #79c0ff; font-family: monospace; font-size: 11px; }
      .line { stroke: #484f58; stroke-width: 1.2; fill: none; }
      .arr { fill: #484f58; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="arr"/>
    </marker>
  </defs>

  <rect x="330" y="20" width="240" height="45" class="box-hi" />
  <text x="450" y="42" text-anchor="middle" class="title">Command Dispatcher ( +0x1A2100 )</text>
  <text x="450" y="56" text-anchor="middle" class="sub">TLS Websocket Command Byte</text>

  <path d="M 450 65 L 450 95 M 120 95 L 780 95" class="line" />

  <line x1="120" y1="95" x2="120" y2="120" class="line" marker-end="url(#arr)" />
  <rect x="30" y="120" width="180" height="55" class="box" />
  <text x="120" y="142" text-anchor="middle" class="title">0x1: Screen Stream</text>
  <text x="120" y="159" text-anchor="middle" class="code">DXGI 60fps Duplication</text>

  <line x1="340" y1="95" x2="340" y2="120" class="line" marker-end="url(#arr)" />
  <rect x="250" y="120" width="180" height="55" class="box" />
  <text x="340" y="142" text-anchor="middle" class="title">0x2: Media Spy</text>
  <text x="340" y="159" text-anchor="middle" class="code">Media Foundation Webcams</text>

  <line x1="560" y1="95" x2="560" y2="120" class="line" marker-end="url(#arr)" />
  <rect x="470" y="120" width="180" height="55" class="box" />
  <text x="560" y="142" text-anchor="middle" class="title">0x3: Shell Exec</text>
  <text x="560" y="159" text-anchor="middle" class="code">Hidden PowerShell Pipe</text>

  <line x1="780" y1="95" x2="780" y2="120" class="line" marker-end="url(#arr)" />
  <rect x="690" y="120" width="180" height="55" class="box" />
  <text x="780" y="142" text-anchor="middle" class="title">0x4: File Manager</text>
  <text x="780" y="159" text-anchor="middle" class="code">Direct Syscall I/O</text>

</svg>